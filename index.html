<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Título, descrição, nome e endereço vêm de src/content/site.ts (veja vite.config.ts) -->
    <title>{{titulo}}</title>
    <meta name="description" content="{{descricao}}" />
    <!-- "noindex" enquanto site.publicado for false: o site fica fora do Google até o Rafa aprovar. -->
    <meta name="robots" content="{{robots}}" />
    <meta name="google-site-verification" content="vSd9EcFv0911Q4IRl9TsVwHJ0EVjst2-ONdmYAmK7dc" />
    <link rel="canonical" href="{{url}}/" />
    <meta name="theme-color" content="#08070b" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="{{nome}}" />
    <meta property="og:title" content="{{titulo}}" />
    <meta property="og:description" content="{{descricao}}" />
    <meta property="og:url" content="{{url}}/" />
    <meta property="og:image" content="{{url}}/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{nome}}: sites e sistemas sob medida" />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // Com JavaScript, as partes de cada seção entram ao rolar. Se o app não carregar em 4 s, mostra tudo.
      document.documentElement.classList.add('js')
      setTimeout(function () {
        if (!window.__revelar) document.documentElement.classList.remove('js')
      }, 4000)
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
